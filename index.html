<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barron’s 333 — MCQ Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf2;--card:#fff;--ink:#1f2937;--muted:#6b7280;--blue:#3d84c6;--line:#d5dbe2;--optb:#dde3ea;--opth:#f3f6f9;--ok:#16a34a;--okbg:#dcfce7;--okink:#14532d;--bad:#dc2626;--badbg:#fee2e2;--badink:#7f1d1d;--btn:#5f7f8e;--accent:#297a2e;--track:#eef1f5;--doneb:#f4fbf6;--partb:#fffaf0;--shadow:rgba(30,50,80,.08);--sub:#4b5563;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--ink:#e5e9ef;--muted:#98a2b3;--blue:#6aa9e0;--line:#334155;--optb:#334155;--opth:#232d3a;--okbg:#12361f;--okink:#bbf7d0;--badbg:#431616;--badink:#fecaca;--btn:#4e6c7a;--accent:#4ade80;--track:#263140;--doneb:#142a1c;--partb:#2d2512;--shadow:rgba(0,0,0,.4);--sub:#b4bcc9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--ink:#e5e9ef;--muted:#98a2b3;--blue:#6aa9e0;--line:#334155;--optb:#334155;--opth:#232d3a;--okbg:#12361f;--okink:#bbf7d0;--badbg:#431616;--badink:#fecaca;--btn:#4e6c7a;--accent:#4ade80;--track:#263140;--doneb:#142a1c;--partb:#2d2512;--shadow:rgba(0,0,0,.4);--sub:#b4bcc9;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Baloo 2','Hind Siliguri','Nirmala UI',system-ui,sans-serif;min-height:100vh;padding:24px 14px 60px}
.wrap{max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:28px 30px 34px;box-shadow:0 6px 24px var(--shadow)}
.title{text-align:center;color:var(--blue);font-weight:800;font-size:26px}
.dash{border:none;border-top:2px dashed var(--line);margin:16px 0 22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.head h2{font-size:22px;font-weight:700}
.overall{font-size:14px;color:var(--muted)}
.track{height:10px;background:var(--track);border-radius:6px;overflow:hidden;margin:10px 0 20px}
.fill{height:100%;background:linear-gradient(90deg,#3d84c6,#297a2e);width:0;transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.sc{background:var(--card);border:1.5px solid var(--optb);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s}
.sc:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--shadow);border-color:var(--blue)}
.sc .sn{font-weight:700;font-size:16px}.sc .sr{font-size:12.5px;color:var(--muted)}.sc .st{font-size:13px;color:var(--muted);margin-top:4px}
.sc.done{border-color:var(--ok);background:var(--doneb)}.sc.partial{border-color:#e0a93b;background:var(--partb)}
.mini{height:6px;background:var(--track);border-radius:4px;margin-top:8px;overflow:hidden}.mini i{display:block;height:100%;background:var(--accent)}
.reset{background:transparent;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer}
.reset:hover{color:var(--bad);border-color:var(--bad)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;flex-wrap:wrap;gap:6px}
.qhead h2{font-size:21px;font-weight:700}
.qcount{color:var(--muted);font-size:15px;font-weight:500}
.pill{font-size:13px;color:var(--accent);font-weight:600;background:var(--track);border:1px solid var(--line);padding:3px 10px;border-radius:20px;margin-right:6px}
.qnum{font-weight:700;margin-right:4px}
.sentence{font-size:19px;line-height:1.55;margin-bottom:6px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);margin:0 4px;font-weight:700;color:var(--blue);text-align:center}
.bnsent{font-size:16px;color:var(--sub);line-height:1.6;margin:4px 0 18px;font-family:'Hind Siliguri','Nirmala UI',sans-serif}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--optb);border-radius:11px;padding:13px 16px;font-family:inherit;font-size:16.5px;color:var(--ink);cursor:pointer;width:100%;transition:background .15s,border-color .15s,transform .1s}
.opt:hover:not(:disabled){background:var(--opth);border-color:var(--blue)}.opt:active:not(:disabled){transform:scale(.99)}.opt:disabled{cursor:default}
.letter{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--track);color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.w{font-weight:600}.bn{color:var(--muted);font-size:14.5px;font-family:'Hind Siliguri','Nirmala UI',sans-serif}
.opt.correct{background:var(--okbg);border-color:var(--ok);color:var(--okink)}.opt.correct .letter{background:var(--ok);color:#fff}.opt.correct .bn{color:inherit}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--badink)}.opt.wrong .letter{background:var(--bad);color:#fff}.opt.wrong .bn{color:inherit}
.opt.dim{opacity:.55}
.fb{margin-top:14px;font-size:15px;font-weight:600;min-height:22px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:10px}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:12px 22px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;color:#fff}
.btn:active{transform:scale(.98)}
.back{background:var(--btn)}.prev{background:#6b7280}.prev:disabled{opacity:.45;cursor:not-allowed}.next{background:#3d84c6}.retry{background:#297a2e}
.result{text-align:center;padding:10px 0 4px}.result .big{font-size:52px;font-weight:800;color:var(--accent)}.result .sub{color:var(--muted);font-size:16px;margin-bottom:20px}
.result .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
.tog{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:999;border:none;border-radius:999px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;color:#fff;background:#297a2e;box-shadow:0 4px 14px rgba(41,122,46,.35)}
.tog.off{background:#6b7280;box-shadow:0 4px 14px rgba(107,114,128,.35)}
.tog .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:7px;vertical-align:middle}
body.bnoff .bn,body.bnoff .bnsent{display:none!important}
@media(max-width:520px){.card{padding:20px 16px 26px}.sentence{font-size:17px}.bnsent{font-size:15px}.opt{font-size:15px;padding:11px 13px}.tog{top:calc(10px + env(safe-area-inset-top,0px));right:10px;padding:7px 12px;font-size:12px}}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:0 0 22px}
.tool{border:1.5px solid var(--blue);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font-family:inherit}
.tool:hover{background:var(--opth)}.tool .tn{font-weight:700;font-size:16px}.tool .ts{font-size:13px;color:var(--muted);margin-top:3px}.tool.zero{opacity:.6;cursor:default}
.opt.sel{background:var(--opth);border-color:var(--blue)}.opt.sel .letter{background:var(--blue);color:#fff}
.pal{display:none;flex-wrap:wrap;gap:6px;margin-top:16px}.pal button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--optb);background:var(--card);color:var(--ink);font-family:inherit;font-weight:600;cursor:pointer}.pal button.ans{background:var(--blue);border-color:var(--blue);color:#fff}.pal button.cur{outline:2px solid var(--accent)}
.subm{background:#b45309;display:none}.pill.low{color:var(--bad)}.next:disabled{opacity:.45;cursor:not-allowed}
.rl{text-align:left;border-top:1px solid var(--line);padding:12px 0;font-size:15px;line-height:1.55}.rl .y{color:var(--muted);font-size:13.5px}
.srow{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.thm{right:auto;left:14px;background:#6b7280;box-shadow:0 4px 14px rgba(107,114,128,.35)}
@media(max-width:520px){.thm{left:10px}}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;align-items:center;justify-content:center;padding:20px}.mask.on{display:flex}
.dlg{background:var(--card);color:var(--ink);border-radius:16px;padding:22px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#dmsg{font-size:17px;line-height:1.5;margin-bottom:18px}.drow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.warn{background:#b45309}
</style>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('barrons333_theme')||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
</head>
<body>
<button id="thm" class="tog thm" type="button" title="Switch light/dark theme"><span id="thml">☀ Light</span></button>
<button id="tog" class="tog" type="button" aria-pressed="true" title="Toggle Bangla translation and meanings"><span class="dot"></span><span id="togl">Bangla On</span></button>
<div class="mask" id="mask"><div class="dlg" role="dialog" aria-modal="true"><div id="dmsg"></div><div class="drow"><button class="btn back" id="dno" type="button">Cancel</button><button class="btn warn" id="dyes" type="button">OK</button></div></div></div>
<div class="wrap"><div class="card">
<div class="title">Barron’s 333 Games</div>
<hr class="dash">
<div id="v-sets">
 <div class="head"><h2>Practice Game Sets</h2><button class="reset" id="reset">Reset all progress</button></div>
 <div class="overall" id="ov">0 / 0 words practiced</div>
 <div class="track"><div class="fill" id="ovbar"></div></div>
 <div class="tools" id="tools"></div>
 <div class="grid" id="grid"></div>
</div>
<div id="v-quiz" style="display:none">
 <div class="qhead"><h2 id="stitle"></h2><div><span class="pill" id="pill">Score: 0</span><span class="qcount" id="qc"></span></div></div>
 <div class="sentence" id="sent"></div><div class="bnsent" id="bns"></div>
 <div class="options" id="opts"></div><div class="fb" id="fb"></div><div class="pal" id="pal"></div>
 <div class="actions"><button class="btn back" id="back">Back to set list</button>
 <div class="nav"><button class="btn subm" id="sub">Submit exam</button><button class="btn prev" id="prev">&larr; Previous</button><button class="btn next" id="next">Next &rarr;</button></div></div>
</div>
<div id="v-setup" style="display:none"><div class="head"><h2>Exam mode</h2></div>
 <div class="overall">Random questions from all 331 words · 36 seconds per question · +1 for correct, −0.25 for wrong, 0 for skipped. You can skip and change answers until you submit.</div>
 <div class="srow"><button class="btn retry" data-n="25">25 questions · 15 min</button><button class="btn retry" data-n="50">50 questions · 30 min</button><button class="btn retry" data-n="100">100 questions · 60 min</button><button class="btn back" id="sback">Back</button></div></div>
<div id="v-res" style="display:none"><div class="result">
 <div class="sub" id="rname"></div><div class="big" id="rscore"></div><div class="sub" id="rpct"></div>
 <div class="acts"><button class="btn retry" id="retry">Retry this set</button><button class="btn back" id="back2">Back to set list</button></div>
<div id="rlist"></div></div></div>
<div class="foot" id="foot"></div>
</div></div>
<script>

function tick(){var s=Math.max(0,Math.round((st.end-Date.now())/1000));$('pill').textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);$('pill').classList.toggle('low',s<60);if(s===0)submit(true)}
function cur(){return ALL[st.items[st.q]]}
function perm(q){if(!st.perm[q]){var a=[];for(var i=0;i<ALL[st.items[q]].options.length;i++)a.push(i);st.perm[q]=shuf(a)}return st.perm[q]}
function getAns(q){return st.mode==='set'?((prog()[st.s]||{}).answers||[])[q]:st.ans[q]}
function curScore(){return st.mode==='set'?sscore(st.s).score:st.score}
function answered(){var c=0;st.items.forEach(function(x,i){if(st.ans[i]!=null)c++});return c}
function renderQ(){
 var it=cur(),n=st.items.length,ex=st.mode==='exam',pm=perm(st.q),a=getAns(st.q);
 $('qc').textContent='Question '+(st.q+1)+' of '+n+(ex?' · '+answered()+' answered':'');
 if(!ex)$('pill').textContent='Score: '+curScore();
 $('sent').innerHTML='<span class="qnum">'+(st.q+1)+'.</span> '+esc(it.sentence).replace(/____/g,'<span class="blank">&nbsp;</span>');
 $('bns').textContent='('+(it.bn_sentence||'')+')';
 var o=$('opts');o.innerHTML='';st.lock=false;$('fb').textContent='';$('fb').className='fb';
 pm.forEach(function(oi,d){var op=it.options[oi],b=document.createElement('button');b.className='opt'+(ex&&a===oi?' sel':'');
  b.innerHTML='<span class="letter">'+L[d]+'</span><span><span class="w">'+esc(op.word)+'</span> <span class="bn">('+esc(op.bn||'')+')</span></span>';
  b.onclick=function(){choose(oi)};o.appendChild(b)});
 $('prev').disabled=st.q===0;
 if(ex){$('next').textContent='Next →';$('next').disabled=st.q===n-1;renderPal()}
 else{$('next').disabled=false;$('next').textContent=st.q===n-1?'See result':'Next →';if(a!=null){st.lock=true;mark(a)}}
}
function renderPal(){var p=$('pal');p.innerHTML='';st.items.forEach(function(x,i){var b=document.createElement('button');b.textContent=i+1;b.className=(st.ans[i]!=null?'ans ':'')+(i===st.q?'cur':'');b.onclick=function(){st.q=i;renderQ()};p.appendChild(b)})}
function mark(ch){
 var it=cur(),pm=perm(st.q);
 document.querySelectorAll('#opts .opt').forEach(function(b,d){b.disabled=true;var oi=pm[d];
  if(oi===it.correct)b.classList.add('correct');else if(oi===ch)b.classList.add('wrong');else b.classList.add('dim')});
 var fb=$('fb');
 if(ch===it.correct){fb.textContent='✓ Correct! Well done.';fb.className='fb ok'}
 else{fb.textContent='✗ Not quite. The correct answer is '+L[pm.indexOf(it.correct)]+'. '+it.options[it.correct].word+'.';fb.className='fb bad'}
}
function choose(o){
 var it=cur();
 if(st.mode==='exam'){st.ans[st.q]=st.ans[st.q]===o?null:o;renderQ();return}
 if(st.lock)return;st.lock=true;var ok=o===it.correct;
 if(st.mode==='set'){var p=prog();if(!p[st.s])p[st.s]={answers:[],score:0,done:false};var s=p[st.s];while(s.answers.length<st.q)s.answers.push(null);
  if(s.answers[st.q]==null){s.answers[st.q]=o;if(ok)s.score=(s.score||0)+1;save(p);rec(it.id,ok)}}
 else if(st.ans[st.q]==null){st.ans[st.q]=o;if(ok)st.score++;rec(it.id,ok)}
 mark(o);$('pill').textContent='Score: '+curScore();
}
function prev(){if(st.q>0){st.q--;renderQ()}}
function next(){
 if(st.q<st.items.length-1){st.q++;renderQ();return}
 if(st.mode==='exam')return;
 if(st.mode==='set'){var p=prog();if(!p[st.s])p[st.s]={answers:[],score:0,done:false};p[st.s].done=true;save(p)}
 var sc=curScore(),n=st.items.length,pct=Math.round(100*sc/n);
 $('rname').textContent=st.title+' complete!';$('rscore').textContent=sc+' / '+n;
 $('rpct').textContent=pct+'% correct'+(pct>=80?' — Excellent!':pct>=50?' — Good, keep practicing.':' — Review and retry.');
 $('rlist').innerHTML='';$('retry').style.display=st.mode==='set'?'':'none';$('retry').textContent='Retry this set';show('res');
}
var askCb=null;
function ask(msg,label,cb){$('dmsg').textContent=msg;$('dyes').textContent=label;askCb=cb;$('mask').classList.add('on')}
function closeAsk(){askCb=null;$('mask').classList.remove('on')}
function submit(auto,force){
 if(st.mode!=='exam'||st.view!=='quiz')return;
 var n=st.items.length,c=0,w=0,sk=0,bad=[];
 st.items.forEach(function(id,i){var a=st.ans[i];if(a==null){sk++;bad.push([i,null])}else if(a===ALL[id].correct)c++;else{w++;bad.push([i,a])}});
 if(!auto&&!force){ask('Submit now? Unanswered: '+sk,'Submit exam',function(){submit(false,true)});return}
 closeAsk();clearInterval(st.timer);
 st.items.forEach(function(id,i){if(st.ans[i]!=null)rec(id,st.ans[i]===ALL[id].correct)});
 var m=Math.round((c-0.25*w)*100)/100,pct=Math.max(0,Math.round(100*m/n)),h=exams();
 h.push({m:m,n:n,p:pct,d:today()});lset(EXK,JSON.stringify(h.slice(-10)));
 $('rname').textContent=st.title+' — submitted';$('rscore').textContent=m+' / '+n;
 $('rpct').textContent=pct+'% · ✓ '+c+' correct · ✗ '+w+' wrong · '+sk+' skipped (−0.25 per wrong)';
 $('rlist').innerHTML=(bad.length?'<div class="sub" style="margin-top:22px;text-align:left">Review: wrong and skipped</div>':'')+bad.map(function(b){
  var q=ALL[st.items[b[0]]],cr=q.options[q.correct];
  return '<div class="rl"><b>'+(b[0]+1)+'.</b> '+esc(q.sentence).replace(/____/g,'<b class="w">'+esc(cr.word)+'</b>')+'<div class="y">'+(b[1]==null?'Skipped':'Your answer: '+esc(q.options[b[1]].word))+' · <span class="w">'+esc(cr.word)+'</span> <span class="bn">('+esc(cr.bn)+')</span></div></div>'}).join('');
 $('retry').style.display='';$('retry').textContent='Take another exam';show('res');
}
function home(){closeAsk();clearInterval(st.timer);show('sets');renderSets();renderTools()}
$('back').onclick=function(){if(st.mode==='exam'){ask('Quit the exam? Your answers will be lost.','Quit exam',home);return}home()};
$('dno').onclick=closeAsk;$('dyes').onclick=function(){var f=askCb;closeAsk();if(f)f()};
$('mask').onclick=function(e){if(e.target===$('mask'))closeAsk()};
$('back2').onclick=home;$('sback').onclick=home;$('next').onclick=next;$('prev').onclick=prev;$('sub').onclick=function(){submit(false)};
document.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){startExam(+b.getAttribute('data-n'))}});
$('retry').onclick=function(){if(st.mode==='exam'){show('setup');return}var p=prog();delete p[st.s];save(p);startSet(st.s)};
$('reset').onclick=function(){ask('Reset ALL progress, mistakes and review schedule? This can’t be undone.','Reset all',function(){ldel(LS);ldel(SRK);ldel(EXK);home()})};
document.addEventListener('keydown',function(e){
 if($('mask').classList.contains('on')){if(e.key==='Escape')closeAsk();return}
 if(st.view!=='quiz')return;var k=e.key.toLowerCase(),pm=perm(st.q),d=L.indexOf(k);
 if(d>-1&&d<pm.length)choose(pm[d]);
 else if(k==='arrowright'){if(st.mode==='exam'||st.lock)next()}else if(k==='arrowleft')prev();
});
var off=lget(BK)==='1';
function applyBn(){document.body.classList.toggle('bnoff',off);$('tog').classList.toggle('off',off);$('tog').setAttribute('aria-pressed',String(!off));$('togl').textContent=off?'Bangla Off':'Bangla On'}
$('tog').onclick=function(){off=!off;lset(BK,off?'1':'0');applyBn()};
$('foot').textContent=ALL.length+' words · '+SETS.length+' sets · randomly split · progress saved in this browser';
var th=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
function applyTh(){document.documentElement.setAttribute('data-theme',th);$('thml').textContent=th==='dark'?'🌙 Dark':'☀ Light'}
$('thm').onclick=function(){th=th==='dark'?'light':'dark';lset('barrons333_theme',th);applyTh()};
applyTh();applyBn();home();
})();
</script>
</body>
